<div class="app-shell">
  <app-navbar [name]="resume.name"></app-navbar>

  <main>
    <app-hero [resume]="resume"></app-hero>
    <app-about [resume]="resume"></app-about>
    <app-experience [experience]="resume.experience"></app-experience>
    <app-projects [projects]="resume.projects"></app-projects>
    <app-skills [skills]="resume.skills"></app-skills>
    <app-contact [contact]="resume.contact" [links]="resume.links"></app-contact>
  </main>

  <footer class="app-footer">
    <div class="footer-inner">
      <div class="footer-id">
        <p class="footer-name">{{ resume.name }}</p>
        <p class="footer-meta">Tempe, AZ · F-1 student on CPT</p>
      </div>

      <p class="footer-line">
        Angular-first full-stack engineer building secure products with a product eye.
      </p>

      <div class="footer-end">
        <p class="footer-copy">© {{ year }}</p>
        <button type="button" class="footer-top" (click)="scrollToTop()">Back to top ↑</button>
      </div>
    </div>
  </footer>
</div>
