<section id="projects" class="section">
  <div class="section-inner">
    <header class="section-heading" appReveal>
      <svg class="section-stroke" viewBox="0 0 320 24" aria-hidden="true" appDrawPath>
        <path d="M4 20 Q 84 -8, 160 14 T 316 8" />
      </svg>
      <p class="section-label">03 — Projects</p>
      <h2>Things I've built recently.</h2>
      <p>AI tooling, embedded coursework, and public-facing Angular work.</p>
    </header>

    <div class="project-list">
      <article
        *ngFor="let project of projects; let i = index"
        class="project-row"
        [appReveal]="90 * i"
      >
        <p class="project-index outline-text" aria-hidden="true">0{{ i + 1 }}</p>

        <div class="project-copy">
          <p class="project-meta">
            {{ project.type }}<span *ngIf="project.period"> · {{ project.period }}</span>
          </p>
          <h3>{{ project.name }}</h3>
          <p class="tagline">{{ project.tagline }}</p>
          <p class="description">{{ project.description }}</p>
        </div>

        <p class="project-tech" *ngIf="project.technologies?.length">
          {{ project.technologies?.join(' / ') }}
        </p>
      </article>
    </div>
  </div>
</section>
