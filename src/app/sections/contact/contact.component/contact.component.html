<section id="contact" class="section">
  <div class="section-inner">
    <div class="contact-stage">
      <header class="section-heading" appReveal>
        <p class="section-label">05 — Contact</p>
        <h2>Open to thoughtful software engineering work with good teams.</h2>
        <p *ngIf="contact.availability">{{ contact.availability }}</p>
      </header>

      <div class="email-block" [appReveal]="120">
        <a class="email-link" href="mailto:{{ contact.email }}">
          <span>{{ contact.email }}</span>
        </a>
        <button
          type="button"
          class="copy-pill"
          (click)="copyEmail()"
          [class.is-copied]="copied()"
          aria-live="polite"
        >
          {{ copied() ? 'Copied' : 'Copy email' }}
        </button>
      </div>

      <div class="meta-row" [appReveal]="200">
        <span class="chip">{{ contact.location }}</span>
        <span *ngIf="contact.phone" class="chip">{{ contact.phone }}</span>
        <span *ngIf="contact.authorization" class="chip">{{ contact.authorization }}</span>
      </div>

      <div class="action-row" [appReveal]="280">
        <a
          *ngIf="linkedinLink as linkedin"
          class="btn primary"
          [href]="linkedin.href"
          target="_blank"
          rel="noreferrer"
        >
          {{ linkedin.label }}
        </a>
        <a
          *ngFor="let link of otherLinks"
          class="btn ghost"
          [href]="link.href"
          [attr.target]="link.external ? '_blank' : null"
          [attr.rel]="link.external ? 'noreferrer' : null"
        >
          {{ link.label }}
        </a>
      </div>
    </div>
  </div>
</section>
