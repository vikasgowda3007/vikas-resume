<section id="skills" class="section">
  <div class="section-inner">
    <header class="section-heading" appReveal>
      <svg class="section-stroke" viewBox="0 0 320 24" aria-hidden="true" appDrawPath>
        <path d="M4 12 H60 M76 12 H132 M148 12 H204 M220 12 H316" />
      </svg>
      <p class="section-label">04 — Toolkit</p>
      <h2>Angular first, backend fluent.</h2>
      <p>
        Full-stack product delivery: shaping frontends, wiring APIs, debugging production
        systems, and keeping releases moving.
      </p>
    </header>

    <div class="skill-grid">
      <article
        *ngFor="let s of skills; let i = index"
        class="card card-pop skill-card"
        [appReveal]="70 * i"
      >
        <svg class="skill-icon" viewBox="0 0 32 32" aria-hidden="true" [appDrawPath]="120 * i">
          <path [attr.d]="iconFor(s)" />
        </svg>

        <h3>{{ s.category }}</h3>

        <ul class="skill-lines">
          <li *ngFor="let item of s.items">{{ item }}</li>
        </ul>
      </article>
    </div>
  </div>
</section>
