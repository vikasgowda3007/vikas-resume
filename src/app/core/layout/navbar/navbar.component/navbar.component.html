<div class="nav-progress" aria-hidden="true">
  <span [style.transform]="'scaleX(' + progress() + ')'"></span>
</div>

<header class="nav">
  <div class="nav-inner">
    <button class="nav-logo" type="button" (click)="scrollHome()" aria-label="Scroll to top">
      <svg
        class="brand-mark"
        viewBox="0 0 40 40"
        aria-hidden="true"
        [appDrawPath]="200"
        drawDuration="900"
      >
        <rect x="2" y="2" width="36" height="36" />
        <path class="brand-v" d="M9 11 L15.5 29 L22 11" />
        <path class="brand-k" d="M26 11 V29 M33 11 L26.5 19.5 L33 29" />
      </svg>
      <span class="brand-block">
        <span class="name">{{ name }}</span>
        <span class="meta">Software Engineer</span>
      </span>
    </button>

    <nav class="nav-links" aria-label="Main navigation">
      <button
        *ngFor="let section of sections"
        type="button"
        class="nav-link"
        [class.active]="activeId() === section.id"
        (click)="scrollTo(section.id)"
      >
        {{ section.label }}
      </button>
    </nav>

    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      [attr.aria-pressed]="isDark()"
    >
      <svg
        *ngIf="!isDark()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4.2" />
        <path
          d="M12 2.8v2.2M12 19v2.2M2.8 12H5M19 12h2.2M5.5 5.5l1.6 1.6M16.9 16.9l1.6 1.6M18.5 5.5l-1.6 1.6M7.1 16.9l-1.6 1.6"
        />
      </svg>
      <svg
        *ngIf="isDark()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20.2 14.2A8.2 8.2 0 0 1 9.8 3.8a8.2 8.2 0 1 0 10.4 10.4Z" />
      </svg>
    </button>
  </div>
</header>
