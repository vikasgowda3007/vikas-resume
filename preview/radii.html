<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_preview.css" />
<style>
  .row-radii { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
  .r { background: #ffffff; border:1px solid var(--line-color); box-shadow: 0 12px 26px rgba(15,23,42,0.08); width:96px; height:96px; display:flex; align-items:flex-end; justify-content:center; padding: 8px; }
  .r span { font-family:var(--font-mono); font-size:11px; color:var(--fg-3); }
  .r.r0 { border-radius: 0.8rem; }
  .r.r1 { border-radius: 1.5rem; }
  .r.r2 { border-radius: 1.6rem; }
  .r.r3 { border-radius: 1.8rem; }
  .r.r4 { border-radius: 2rem; }
  .r.r5 { border-radius: 2.4rem; }
  .r.pill { border-radius: 999px; width: 130px; height: 56px; align-items:center; }
</style>
</head>
<body class="card">
  <p class="eyebrow" style="margin-bottom:14px;">Corner radii — small chip → portrait → pill</p>
  <div class="row-radii">
    <div class="r r0"><span>0.8</span></div>
    <div class="r r1"><span>1.5</span></div>
    <div class="r r2"><span>1.6</span></div>
    <div class="r r3"><span>1.8</span></div>
    <div class="r r4"><span>2.0</span></div>
    <div class="r r5"><span>2.4</span></div>
    <div class="r pill"><span>999 pill</span></div>
  </div>
</body>
</html>
