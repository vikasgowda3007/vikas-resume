<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_preview.css" />
<style>
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
  .swatch-chip.accent { background: #1677ff; }
  .swatch-chip.accent-strong { background: #0f5fd8; }
  .swatch-chip.accent-soft { background: rgba(22,119,255,0.12); border-color: rgba(22,119,255,0.28); }
  .swatch-chip.accent-dark { background: #74b3ff; }
</style>
</head>
<body class="card">
  <p class="eyebrow" style="margin-bottom:14px;">Accent — electric blue (the only chromatic color)</p>
  <div class="grid">
    <div class="swatch">
      <div class="swatch-chip accent"></div>
      <div class="swatch-name">Accent</div>
      <div class="swatch-token">#1677FF · --accent-color</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip accent-strong"></div>
      <div class="swatch-name">Accent strong</div>
      <div class="swatch-token">#0F5FD8 · CTA gradient end</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip accent-soft"></div>
      <div class="swatch-name">Accent soft</div>
      <div class="swatch-token">rgba(22,119,255,.12)</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip accent-dark"></div>
      <div class="swatch-name">Accent (dark mode)</div>
      <div class="swatch-token">#74B3FF</div>
    </div>
  </div>
</body>
</html>
