<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_preview.css" />
<style>
  body.card { padding: 0; }
  .contact { background: radial-gradient(circle at top right, rgba(116,179,255,0.28), transparent 22%), radial-gradient(circle at left 20%, rgba(22,119,255,0.18), transparent 18%), linear-gradient(180deg, #071020 0%, #050816 100%); padding: 28px; min-height: 240px; border-radius: 18px; color: #f8fbff; }
  .label { text-transform: uppercase; letter-spacing: 0.18em; font-size: 0.72rem; color: rgba(226,232,240,0.52); margin: 0 0 10px 0; font-family: var(--font-mono); text-align:center; }
  .card-inner { margin: 0 auto; max-width: 32rem; padding: 1.4rem; border-radius: 1.5rem; background: linear-gradient(180deg, rgba(15,23,42,0.28), rgba(8,14,30,0.5)), rgba(8,14,30,0.68); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 26px 60px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.06); }
  .email { display:block; text-align:center; font-size: 1.55rem; font-weight: 700; letter-spacing: -0.04em; color: #f8fbff; text-decoration:none; }
  .meta { text-align:center; color: rgba(226,232,240,0.78); margin-top: 8px; font-size: .9rem; }
  .links { display:flex; justify-content:center; gap: 0.6rem; margin-top: 16px; flex-wrap: wrap; }
  .links a { border-radius: 999px; padding: 0.55rem 0.9rem; font-size: 0.85rem; text-decoration:none; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04); color: #f8fbff; }
</style>
</head>
<body class="card">

      <div class="links">

      </div>
    </div>
  </div>

</html>
