<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_preview.css" />
<style>
  .panel { padding: 1px; border-radius: 1.8rem; background: linear-gradient(135deg, rgba(22,119,255,0.5), rgba(255,255,255,0.18)); }
  .inner { padding: 1.35rem; border-radius: inherit; background: radial-gradient(circle at top right, rgba(22,119,255,0.14), transparent 36%), linear-gradient(180deg, rgba(255,255,255,0.85), #edf2f8); }
  .label { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); margin: 0 0 12px 0; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap: 0.55rem; }
  li { padding: 0.72rem 0.8rem; border-radius: 999px; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.8); font-size: 0.9rem; color: var(--fg-2); }
  body.card { display:flex; gap: 18px; }
  .panel { flex:1; }
</style>
</head>
<body class="card">
  <div class="panel"><div class="inner">
    <p class="label">Focus</p>
    <ul>
      <li>Python</li>
      <li>Groq LLM API</li>
      <li>python-docx</li>
      <li>Prompt Engineering</li>
    </ul>
  </div></div>
  <div class="panel"><div class="inner">
    <p class="label">Focus</p>
    <ul>
      <li>Embedded Systems</li>
      <li>Real-time Computing</li>
      <li>Sensors &amp; Actuators</li>
    </ul>
  </div></div>
</body>
</html>
