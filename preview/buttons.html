<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_preview.css" />
<style>
  body.card { display:flex; align-items:center; gap:24px; padding: 24px; }
  .btn { border-radius: 999px; padding: 0.88rem 1.35rem; font-size: 0.92rem; font-weight: 600; border: 1px solid var(--line-color); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:0.45rem; cursor:pointer; box-shadow: 0 12px 26px rgba(15,23,42,0.08); transition: all 180ms ease; font-family: var(--font-sans); }
  .btn.primary { background: linear-gradient(180deg,#1677ff,#0f5fd8); color: #fff; border-color: transparent; }
  .btn.primary.hover { transform: translateY(-1px); box-shadow: 0 18px 36px rgba(22,119,255,0.24); }
  .btn.ghost { background: rgba(255,255,255,0.92); color: var(--fg-1); }
  .btn.ghost.hover { background: #fff; box-shadow: 0 16px 30px rgba(15,23,42,0.10); transform: translateY(-1px); }
  .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--fg-3); margin-top: 6px; text-align:center; }
  .col { display:flex; flex-direction:column; align-items:center; gap:6px; }
</style>
</head>
<body class="card">
  <div class="col">
    <a class="btn primary">Email Vikas</a>
    <span class="label">primary · rest</span>
  </div>
  <div class="col">
    <a class="btn primary hover">Email Vikas</a>
    <span class="label">primary · hover</span>
  </div>
  <div class="col">
    <a class="btn ghost">LinkedIn</a>
    <span class="label">ghost · rest</span>
  </div>
  <div class="col">
    <a class="btn ghost hover">LinkedIn</a>
    <span class="label">ghost · hover</span>
  </div>
</body>
</html>
