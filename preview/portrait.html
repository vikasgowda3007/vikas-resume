<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_preview.css" />
<style>
  body.card { padding: 20px; display:flex; gap: 22px; align-items:center; }
  .portrait { position: relative; width: 220px; flex-shrink: 0; }
  .orbit { position: absolute; inset: -12px -16px 20px 20px; border-radius: 36px; background: radial-gradient(circle at 18% 20%, rgba(255,255,255,0.7), transparent 26%), radial-gradient(circle at 75% 18%, rgba(22,119,255,0.26), transparent 38%), linear-gradient(180deg, rgba(255,255,255,0.32), transparent 70%); opacity: 0.8; }
  .frame { position:relative; aspect-ratio: 0.82; border-radius: 28px; overflow:hidden; border: 1px solid rgba(15,23,42,0.12); box-shadow: 0 28px 70px rgba(15,23,42,0.18), inset 0 1px 0 rgba(255,255,255,0.55); }
  .frame img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.96) contrast(1.02); }
  .frame::after { content:''; position:absolute; inset:0; background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent 28%, rgba(15,23,42,0.1)); pointer-events:none; }
  .desc { font-size: 14px; color: var(--fg-2); line-height: 1.65; }
  .desc b { color: var(--fg-1); }
  .desc code { font-family: var(--font-mono); font-size: 12px; color: var(--fg-3); }
</style>
</head>
<body class="card">
  <div class="portrait">
    <div class="orbit"></div>
    <div class="frame"><img src="../assets/portraits/vikas-hero-760.jpg" alt="" /></div>
  </div>
  <div class="desc">
    <b>Hero portrait.</b> The only photograph in the brand. <code>aspect-ratio: 0.82</code>, <code>border-radius: 2.4rem</code>. Lives behind a glow "orbit" with three layered radial gradients. Always slightly desaturated <code>saturate(0.96)</code> with a faint top-down glass overlay.
  </div>
</body>
</html>
