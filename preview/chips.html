<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_preview.css" />
<style>
  .chips { display:flex; flex-wrap:wrap; gap: 0.65rem; }
  .chip-skill { padding: 0.7rem 0.95rem; border-radius: 999px; background: rgba(255,255,255,0.94); border: 1px solid rgba(255,255,255,0.82); box-shadow: 0 10px 22px rgba(15,23,42,0.05); color: var(--fg-2); font-size: 0.9rem; }
  .chip-focus { padding: 0.58rem 0.9rem; border-radius: 999px; font-size: 0.82rem; color: var(--fg-2); background: rgba(255,255,255,0.88); border: 1px solid rgba(15,23,42,0.1); backdrop-filter: blur(16px) saturate(140%); }
</style>
</head>
<body class="card">
  <p class="eyebrow" style="margin-bottom:10px;">Skill chips · text-only pills</p>
  <div class="chips" style="margin-bottom:18px;">
    <span class="chip-skill">Angular</span>
    <span class="chip-skill">Java</span>
    <span class="chip-skill">Node.js</span>
    <span class="chip-skill">Python</span>
    <span class="chip-skill">PostgreSQL</span>
    <span class="chip-skill">Docker</span>
    <span class="chip-skill">Jenkins</span>
  </div>
  <p class="eyebrow" style="margin-bottom:10px;">Focus chips · glass with backdrop-blur</p>
  <div class="chips">
    <span class="chip-focus">M.S. in Computer Science at ASU</span>
    <span class="chip-focus">TA / Grader for Software Security</span>
    <span class="chip-focus">Angular + Java / Node.js</span>
  </div>
</body>
</html>
