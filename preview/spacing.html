<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_preview.css" />
<style>
  .scale-spacing { display:flex; flex-direction:column; gap:8px; }
  .row-s { display:flex; align-items:center; gap:14px; }
  .row-s .label { width: 90px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: .12em; text-transform: uppercase; }
  .bar { height: 14px; background: linear-gradient(90deg,#1677ff,#74b3ff); border-radius: 4px; }
  .px { font-family: var(--font-mono); font-size:11px; color:var(--fg-2); }
</style>
</head>
<body class="card">
  <p class="eyebrow" style="margin-bottom:12px;">Spacing scale — used for gaps, padding, gutters</p>
  <div class="scale-spacing">
    <div class="row-s"><span class="label">space-1</span><div class="bar" style="width:4px;"></div><span class="px">4px / .25rem</span></div>
    <div class="row-s"><span class="label">space-2</span><div class="bar" style="width:8px;"></div><span class="px">8px / .5rem</span></div>
    <div class="row-s"><span class="label">space-3</span><div class="bar" style="width:12px;"></div><span class="px">12px / .75rem</span></div>
    <div class="row-s"><span class="label">space-4</span><div class="bar" style="width:16px;"></div><span class="px">16px / 1rem</span></div>
    <div class="row-s"><span class="label">space-5</span><div class="bar" style="width:24px;"></div><span class="px">24px / 1.5rem · card padding</span></div>
    <div class="row-s"><span class="label">space-6</span><div class="bar" style="width:32px;"></div><span class="px">32px / 2rem</span></div>
    <div class="row-s"><span class="label">space-7</span><div class="bar" style="width:48px;"></div><span class="px">48px / 3rem</span></div>
    <div class="row-s"><span class="label">space-8</span><div class="bar" style="width:72px;"></div><span class="px">72px / 4.5rem · section min</span></div>
  </div>
</body>
</html>
