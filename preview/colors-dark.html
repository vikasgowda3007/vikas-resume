<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_preview.css" />
<style>
  body.card { background:
    radial-gradient(circle at top left, rgba(74,144,255,0.18), transparent 24%),
    radial-gradient(circle at 84% 10%, rgba(133,92,255,0.12), transparent 20%),
    linear-gradient(180deg, #09101f 0%, #050816 46%, #050816 100%);
    color: #f5f7fb; }
  .eyebrow { color: #9eabc0; }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
  .swatch-chip.fg1 { background: #f5f7fb; }
  .swatch-chip.fg2 { background: #d4dced; }
  .swatch-chip.fg3 { background: #9eabc0; }
  .swatch-chip.bg { background: #050816; border:1px solid rgba(255,255,255,0.08); }
  .swatch-chip.surface-strong { background: #0e1830; border:1px solid rgba(255,255,255,0.08); }
  .swatch-chip.surface-muted { background: #111d38; border:1px solid rgba(255,255,255,0.08); }
  .swatch-chip.line { background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); }
  .swatch-chip.accent { background: #74b3ff; }
  .swatch-name { color: #f5f7fb; }
  .swatch-token { color: #9eabc0; }
</style>
</head>
<body class="card">
  <p class="eyebrow" style="margin-bottom:14px;">Dark theme · navy + softened accent</p>
  <div class="grid">
    <div class="swatch"><div class="swatch-chip fg1"></div><div class="swatch-name">FG 1</div><div class="swatch-token">#F5F7FB</div></div>
    <div class="swatch"><div class="swatch-chip fg2"></div><div class="swatch-name">FG 2</div><div class="swatch-token">#D4DCED</div></div>
    <div class="swatch"><div class="swatch-chip fg3"></div><div class="swatch-name">FG 3</div><div class="swatch-token">#9EABC0</div></div>
    <div class="swatch"><div class="swatch-chip bg"></div><div class="swatch-name">Background</div><div class="swatch-token">#050816</div></div>
    <div class="swatch"><div class="swatch-chip surface-strong"></div><div class="swatch-name">Surface strong</div><div class="swatch-token">#0E1830</div></div>
    <div class="swatch"><div class="swatch-chip surface-muted"></div><div class="swatch-name">Surface muted</div><div class="swatch-token">#111D38</div></div>
    <div class="swatch"><div class="swatch-chip line"></div><div class="swatch-name">Line</div><div class="swatch-token">white · 8% alpha</div></div>
    <div class="swatch"><div class="swatch-chip accent"></div><div class="swatch-name">Accent</div><div class="swatch-token">#74B3FF</div></div>
  </div>
</body>
</html>
